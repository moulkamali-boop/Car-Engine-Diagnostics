/* ═══════════════════════════════════════════════════════════════
   🎬 FINAL VERDICT
   ═══════════════════════════════════════════════════════════════ */
function getMeasuredCount(){
    return [1,2,3].filter(function(i){
        return sensorState[i].status === 'done';
    }).length;
}

function getSkippedCount(){
    return [1,2,3].filter(function(i){
        return sensorState[i].status === 'skipped';
    }).length;
}

function requestFinalVerdict(){
    var measured = getMeasuredCount();
    var skipped = getSkippedCount();

    if (measured === 0){
        showToast('⚠️ ' + t('sensor_count_0'));
        return;
    }

    var icon  = document.getElementById('finalConfirmIcon');
    var title = document.getElementById('finalConfirmTitle');
    var msg   = document.getElementById('finalConfirmMsg');
    var yes   = document.getElementById('finalConfirmYes');
    var no    = document.getElementById('finalConfirmNo');
    var yesL  = document.getElementById('finalConfirmYesLabel');
    var noL   = document.getElementById('finalConfirmNoLabel');

    icon.textContent  = '📊';
    title.textContent = t('final_confirm_title');

    var countMsg = measured === 3 ? t('sensor_count_3') :
                   measured === 2 ? t('sensor_count_2') :
                                    t('sensor_count_1');

    var incompleteNote = '';
    if (measured < 3){
        var remaining = 3 - measured - skipped;
        if (remaining > 0){
            incompleteNote =
                '<div style="margin-top:10px;padding:8px 10px;background:#7c2d1222;' +
                'border:1px solid #f59e0b;border-radius:8px;font-size:0.75rem;color:#fbbf24;text-align:right">' +
                '⚠️ ' + tFormat('confirm_incomplete', remaining) +
                '</div>';
        }
    }

    msg.innerHTML =
        '<span style="color:#06b6d4;font-weight:700">' + countMsg + '</span><br><br>' +
        '<span style="color:#f59e0b;font-weight:600">' + t('confirm_deduct') + '</span>' +
        incompleteNote;

    yesL.textContent = t('final_confirm_yes');
    noL.textContent  = t('final_confirm_no');
    yes.onclick = confirmFinalVerdict;
    no.onclick  = cancelFinalVerdict;

    document.getElementById('finalConfirmOverlay').classList.add('show');
}

function cancelFinalVerdict(){
    document.getElementById('finalConfirmOverlay').classList.remove('show');
}

function confirmFinalVerdict(){
    document.getElementById('finalConfirmOverlay').classList.remove('show');

    var measured = getMeasuredCount();
    if (measured === 0){
        showToast('⚠️ ' + t('sensor_count_0'));
        return;
    }

    var raw = {
        audio:     window._sensorResults.audio     || { ok:false },
        vibration: window._sensorResults.vibration || { ok:false },
        smoke:     window._sensorResults.smoke     || { ok:false }
    };
    var deep = VehiclePipeline.process(raw);
    window._deepResult = deep;

    if (!isAdmin){
        if (!consumeOneCredit()){
            showToast('⚠️ ' + t('no_credits'));
            document.getElementById('purchasePrompt').classList.add('show');
            return;
        }
    }

    finalShown = true;
    renderFinalVerdict();
}

function renderFinalVerdict(){
    var deep = window._deepResult;
    var fv = document.getElementById('finalVerdict');
    var icon = document.getElementById('finalIcon');
    var sentence = document.getElementById('verdictSentence');
    var solDiv = document.getElementById('verdictSolution');
    var countNotice = document.getElementById('sensorCountNotice');

    fv.className = 'final-verdict show';
    fv.style.display = 'block';

    if (!deep || !deep.ok){
        fv.classList.add('gray');
        icon.textContent = '⚠️';
        sentence.textContent = t('no_data');
        solDiv.style.display = 'none';
        countNotice.className = 'sensor-count-notice none';
        countNotice.textContent = t('sensor_count_0');
        return;
    }

    if (deep.validCount === 3){
        countNotice.className = 'sensor-count-notice good';
        countNotice.textContent = t('sensor_count_3');
    } else if (deep.validCount === 2){
        countNotice.className = 'sensor-count-notice partial';
        countNotice.textContent = t('sensor_count_2');
    } else {
        countNotice.className = 'sensor-count-notice limited';
        countNotice.textContent = t('sensor_count_1');
    }

    var top = deep.ranking[0];
    if (!top || top.score <= 0.01){
        fv.classList.add('yellow');
        icon.textContent = '🟡';
        sentence.textContent = t('no_match');
        solDiv.textContent = t('no_match_desc');
        solDiv.style.display = 'block';
        solDiv.style.color = '#fff';
        return;
    }

    var confidence = Math.round(top.score * 100);
    if (confidence >= 60) fv.classList.add('green');
    else if (confidence >= 30) fv.classList.add('yellow');
    else fv.classList.add('orange');

    icon.textContent = confidence >= 60 ? '🟢' : confidence >= 30 ? '🟡' : '🟠';

    var html = '<div style="font-size:1.15rem;margin-bottom:8px">' +
               top.family.icon + ' ' + t(top.family.nameKey) + '</div>';
    if (top.topFault){
        html += '<div style="font-size:0.9rem;color:#cbd5e1;margin-bottom:6px">' +
                '→ ' + faultName(top.topFault) + '</div>';
    }
    html += '<div style="font-size:0.85rem;opacity:0.85">' +
            t('confidence_label') + ': ' + confidence + '%</div>';
    sentence.innerHTML = html;
    sentence.style.color = '#fff';

    var alt = '';
    var alternatives = deep.ranking.slice(1, 4).filter(function(r){ return r.score > 0.05; });
    if (alternatives.length > 0){
        alt += '<div style="font-size:0.8rem;color:#94a3b8;margin-bottom:6px">' +
               t('deep_top_families') + ':</div>';
        alternatives.forEach(function(item){
            var pct = Math.round(item.score * 100);
            alt += '<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:0.8rem">' +
                   '<span>' + item.family.icon + ' ' + t(item.family.nameKey) + '</span>' +
                   '<span style="color:' + item.family.color + ';font-family:monospace">' + pct + '%</span>' +
                   '</div>';
        });
    }
    if (deep.rpm){
        alt += '<div style="margin-top:10px;font-size:0.75rem;color:#94a3b8;font-family:monospace">' +
               t('deep_rpm') + ' ≈ ' + deep.rpm + '</div>';
    }
    if (alt){
        solDiv.innerHTML = alt;
        solDiv.style.display = 'block';
        solDiv.style.color = 'inherit';
    } else {
        solDiv.style.display = 'none';
    }

    renderPhysicalPanel(deep);
    fv.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function returnFromVerdict(){
    document.getElementById('finalVerdict').classList.remove('show');
    document.getElementById('deepPanel').style.display = 'none';
    document.getElementById('labArea').style.display = 'none';
    document.getElementById('startBtn').style.display = 'block';
    document.getElementById('startBtn').disabled = false;
    document.getElementById('startBtn').style.opacity = '1';

    for (var i = 1; i <= 3; i++){
        cleanupStreams(i);
        sensorState[i] = { status:'idle', value:null, sub:null, confirmed:false };
        updateSensorUI(i);
    }
    window._sensorResults = { audio:null, vibration:null, smoke:null };
    finalShown = false;
    userNote = '';
    document.getElementById('noteTextArea').value = '';
    document.getElementById('noteTextArea').style.display = 'none';
    window._deepResult = null;

    if (getTotalCredits() <= 0){
        document.getElementById('purchasePrompt').classList.add('show');
    } else {
        document.getElementById('purchasePrompt').classList.remove('show');
    }
    window.scrollTo({ top:0, behavior:'smooth' });
}

/* ═══════════════════════════════════════════════════════════════
   📊 PHYSICAL PANEL
   ═══════════════════════════════════════════════════════════════ */
function renderPhysicalPanel(deep){
    if (!deep || !deep.ok) return;
    var panel = document.getElementById('deepPanel');
    panel.style.display = 'block';

    document.getElementById('deepPanelTitle').textContent = t('deep_panel_title');
    document.getElementById('lblQuality').textContent = t('deep_quality');
    document.getElementById('lblSNR').textContent = t('deep_snr');
    document.getElementById('lblTopFamilies').textContent = t('deep_top_families');
    document.getElementById('lblRPM').textContent = t('deep_rpm');

    var snr = deep.snr || 0;
    var qualityPct = Math.min(100, Math.max(0, (snr - 15) * 4));
    document.getElementById('valQuality').textContent = Math.round(qualityPct) + '%';
    document.getElementById('barQuality').style.width = qualityPct + '%';
    document.getElementById('valSNR').textContent = snr + ' dB';
    document.getElementById('barSNR').style.width = Math.min(100, snr * 3.3) + '%';

    if (deep.rpm){
        document.getElementById('rpmSection').style.display = 'block';
        document.getElementById('valRPM').textContent = deep.rpm + ' RPM';
    } else {
        document.getElementById('rpmSection').style.display = 'none';
    }

    var list = document.getElementById('topFamiliesList');
    list.innerHTML = '';
    var ranked = deep.ranking.slice(0, 5);
    ranked.forEach(function(item, idx){
        var pct = Math.round(item.score * 100);
        if (pct <= 0 && idx > 0) return;
        var row = document.createElement('div');
        row.className = 'family-row' + (idx === 0 ? ' primary' : '');
        row.innerHTML =
            '<span class="fam-icon">' + item.family.icon + '</span>' +
            '<span class="fam-name">' + t(item.family.nameKey) + '</span>' +
            '<div class="fam-mini-bar"><div class="fam-mini-fill" style="width:' + pct + '%"></div></div>' +
            '<span class="fam-pct">' + pct + '%</span>';
        list.appendChild(row);
    });
}

   ═══════════════════════════════════════════════════════════════ */
function toggleNoteText(){
    var ta = document.getElementById('noteTextArea');
    if (ta.style.display === 'block'){
        ta.style.display = 'none';
        userNote = ta.value;
    } else {
        ta.style.display = 'block';
        ta.focus();
    }
}

function startVoiceNote(){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR){
        showToast('⚠️ ' + t('voice_not_supported'));
        toggleNoteText();
        return;
    }
    if (isRecording) return;
    isRecording = true;
    document.getElementById('recordingIndicator').classList.add('active');
    document.getElementById('speakBtn').disabled = true;

    recognition = new SR();
    var langMap = {
        ar:'ar-SA', en:'en-US', fr:'fr-FR', es:'es-ES', de:'de-DE',
        it:'it-IT', pt:'pt-PT', ru:'ru-RU', zh:'zh-CN', ja:'ja-JP',
        ko:'ko-KR', hi:'hi-IN', tr:'tr-TR', id:'id-ID', ms:'ms-MY',
        vi:'vi-VN', th:'th-TH', nl:'nl-NL', pl:'pl-PL', sv:'sv-SE',
        fa:'fa-IR', ur:'ur-PK', sw:'sw-KE'
    };
    recognition.lang = langMap[currentLang] || 'en-US';
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onresult = function(e){
        var text = e.results[0][0].transcript;
        var ta = document.getElementById('noteTextArea');
        ta.style.display = 'block';
        ta.value = (ta.value ? ta.value + ' ' : '') + text;
        userNote = ta.value;
    };
    recognition.onerror = function(){};
    recognition.onend = function(){ stopVoiceNote(); };

    try { recognition.start(); } catch(e){ stopVoiceNote(); }
    recordingTimeout = setTimeout(function(){ stopVoiceNote(); }, 5000);
}

function stopVoiceNote(){
    if (!isRecording) return;
    isRecording = false;
    clearTimeout(recordingTimeout);
    document.getElementById('recordingIndicator').classList.remove('active');
    document.getElementById('speakBtn').disabled = false;
    try { if (recognition) recognition.stop(); } catch(e){}
    var ta = document.getElementById('noteTextArea');
    if (ta) userNote = ta.value;
}

/* ═══════════════════════════════════════════════════════════════
   🔧 TOOLBAR

function getReportText(){
    var now = new Date();
    var lines = [];
    lines.push('🚗 Engine Vehicle Symptom Estimator');
    lines.push('════════════════════════');
    lines.push('📅 ' + t('report_date') + ': ' + now.toLocaleDateString('en-GB'));
    lines.push('🕐 ' + t('report_time') + ': ' + now.toLocaleTimeString('en-GB'));
    lines.push('🆔 ' + t('report_device') + ': ' + document.getElementById('deviceId').textContent);
    if (locationStatus && locationStatus !== 'denied' && locationStatus !== 'unavailable' && locationStatus !== 'na'){
        lines.push('📍 GPS: ' + locationStatus);
    }
    lines.push('════════════════════════');
    lines.push('📊 ' + t('report_sensors_used') + ':');
    for (var i = 1; i <= 3; i++){
        var st = sensorState[i];
        var icon = i === 1 ? '🎤' : i === 2 ? '📸' : '📳';
        if (st.status === 'done' && st.confirmed){
            lines.push('  ✅ ' + icon + ' ' + t('sensor' + i) + ' — ' + (st.value || ''));
        } else if (st.status === 'done'){
            lines.push('  ⚡ ' + icon + ' ' + t('sensor' + i) + ' — ' + (st.value || ''));
        } else if (st.status === 'skipped'){
            lines.push('  ⏭ ' + icon + ' ' + t('sensor' + i) + ' (' + t('skipped_msg') + ')');
        } else {
            lines.push('  ⬜ ' + icon + ' ' + t('sensor' + i) + ' (' + t('not_measured') + ')');
        }
    }
    lines.push('════════════════════════');

    if (finalShown){
        var deep = window._deepResult;
        if (deep && deep.ok && deep.ranking && deep.ranking.length > 0){
            var top = deep.ranking[0];
            lines.push('📋 ' + t('report_verdict') + ':');
            lines.push(top.family.icon + ' ' + t(top.family.nameKey));
            if (top.topFault) lines.push('→ ' + faultName(top.topFault));
            lines.push(t('confidence_label') + ': ' + Math.round(top.score * 100) + '%');
            lines.push('');
            lines.push(document.getElementById('sensorCountNotice').textContent);
        } else {
            lines.push('⚠️ ' + t('no_match'));
            lines.push(t('no_match_desc'));
        }
    } else {
        lines.push('⚠️ ' + t('no_data'));
    }

    if (userNote && userNote.length >= 4){
        lines.push('════════════════════════');
        lines.push('💭 ' + userNote);
    }
    lines.push('════════════════════════');
    lines.push('⚠️ ' + t('legal'));
    lines.push('');
    lines.push('© 2026 Engine Vehicle Symptom Estimator');
    return lines.join('\n');
}

function printReport(){
    if (!finalShown){
        showToast('⚠️ ' + t('final_btn_label'));
        return;
    }
    var container = document.getElementById('reportContainer');
    var now = new Date();

    var sensorRows = '';
    for (var i = 1; i <= 3; i++){
        var st = sensorState[i];
        var icon = i === 1 ? '🎤' : i === 2 ? '📸' : '📳';
        var statusText = t('not_measured');
        var valueText = '—';
        if (st.status === 'done' && st.confirmed){
            statusText = '✅ ' + t('confirmed_msg');
            valueText = st.value || '—';
        } else if (st.status === 'done'){
            statusText = '⚡ ' + t('measure_done');
            valueText = st.value || '—';
        } else if (st.status === 'skipped'){
            statusText = '⏭ ' + t('skipped_msg');
        }
        sensorRows += '<div class="sensor-row"><span>' + icon + ' ' + t('sensor' + i) +
                      '</span><span>' + statusText + ' | ' + valueText + '</span></div>';
    }

    var deep = window._deepResult;
    var verdictText = t('no_data');
    var solutionText = '';
    if (deep && deep.ok && deep.ranking && deep.ranking.length > 0){
        var top = deep.ranking[0];
        verdictText = top.family.icon + ' ' + t(top.family.nameKey);
        if (top.topFault) verdictText += ' — ' + faultName(top.topFault);
        verdictText += ' (' + Math.round(top.score * 100) + '%)';
        var alts = deep.ranking.slice(1, 4).filter(function(r){ return r.score > 0.05; });
        if (alts.length > 0){
            solutionText = t('deep_top_families') + ': ';
            solutionText += alts.map(function(item){
                return item.family.icon + ' ' + t(item.family.nameKey) +
                       ' (' + Math.round(item.score * 100) + '%)';
            }).join(' · ');
        }
    } else if (deep && deep.ok){
        verdictText = '⚠️ ' + t('no_match');
        solutionText = t('no_match_desc');
    }

    var sensorCount = document.getElementById('sensorCountNotice').textContent || '';
    var noteText = (document.getElementById('noteTextArea').value || '').trim();

    var html = '';
    html += '<div class="report-header"><h1>🚗 Engine Vehicle Symptom Estimator</h1></div>';
    html += '<div class="report-info">';
    html += '<div><strong>' + t('report_device') + '</strong>' +
            document.getElementById('deviceId').textContent + '</div>';
    html += '<div><strong>' + t('report_date') + '</strong>' +
            now.toLocaleDateString('en-GB') + '</div>';
    html += '<div><strong>' + t('report_time') + '</strong>' +
            now.toLocaleTimeString('en-GB') + '</div>';
    html += '</div>';
    html += '<div class="report-section"><h2>📊 ' + t('report_sensors_used') + '</h2>' +
            sensorRows + '</div>';
    html += '<div class="report-section"><h2>📋 ' + t('report_verdict') + '</h2>';
    html += '<div class="report-verdict"><p>' + verdictText + '</p>';
    if (solutionText){
        html += '<div style="color:#166534;margin-top:8px">🔧 ' + solutionText + '</div>';
    }
    html += '</div>';
    html += '<div style="text-align:center;font-size:0.75rem;color:#666;margin-top:8px">' +
            sensorCount + '</div></div>';
    if (noteText.length >= 4){
        html += '<div style="background:#fef3c7;border-left:4px solid #f59e0b;padding:12px;border-radius:8px;font-size:0.85rem;color:#78350f">💭 ' +
                noteText + '</div>';

    html += '<div class="report-disclaimer">⚠️ ' + t('legal') + '</div>';
    html += '<div class="report-watermark">© 2026 Engine Vehicle Symptom Estimator</div>';
    html += '<div class="report-actions">';
    html += '<button class="btn-print-pdf" onclick="window.print()">' + t('report_print_pdf') + '</button>';
    html += '<button class="btn-close-report" onclick="closeReport()">✖ ' + t('report_close_btn') + '</button>';
    html += '</div>';

    container.innerHTML = html;
    document.getElementById('reportOverlay').classList.add('show');

async function verifyGumroadLicense(key){
    var permalinks = Object.keys(GUMROAD_CAR.permalinks);
    for (var i = 0; i < permalinks.length; i++){
        var permalink = GUMROAD_CAR.permalinks[permalinks[i]];
        try {
            var res = await fetch('https://api.gumroad.com/v2/licenses/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    product_permalink: permalink,
                    license_key: key,
                    increment_uses_count: 'false'
                }).toString()
            });
            var data = await res.json();
            if (data && data.success && data.purchase && !data.purchase.refunded && !data.purchase.chargebacked){
                try {
                    await fetch('https://api.gumroad.com/v2/licenses/verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams({
                            product_permalink: permalink,
                            license_key: key,
                            increment_uses_count: 'true'
                        }).toString()
                    });
                } catch(e){}
                return {
                    valid: true,
                    credits: parseInt(permalinks[i]),
                    uses: data.uses || 0
                };
            }
        } catch(e){}
    }
    return { valid: false };
}

async function activateCode(){
    var input = document.getElementById('codeInput');
    var code = input.value.trim();
    if (!code) return;

    var btn = document.getElementById('activateBtn');
    btn.disabled = true;
    showToast('⏳ ' + t('verifying'));

    try {
        var result = await verifyGumroadLicense(code);
        if (result.valid){
            if (result.uses > 1){
                showToast('⚠️ ' + t('license_already_used'));
            } else {
                paidCredits += result.credits;
                saveCredits();
                updateCreditsDisplay();
                showToast('✅ ' + tFormat('license_activated', result.credits));
                document.getElementById('purchasePrompt').classList.remove('show');
            }
        } else {
            showToast('❌ ' + t('invalid'));
        }
    } catch(e){
        showToast('❌ ' + t('network_error'));
    }
    input.value = '';
    btn.disabled = false;
}

   📍 LOCATION
   ═══════════════════════════════════════════════════════════════ */
function initLocation(){
    var el = document.getElementById('locationDisplay');
    if (!el) return;
    if (!navigator.geolocation){
        locationStatus = 'unavailable';
        el.textContent = t('location_unavailable');
        return;
    }
    el.textContent = t('location_loading');
    navigator.geolocation.getCurrentPosition(
        function(pos){
            locationStatus = pos.coords.latitude.toFixed(4) + ', ' + pos.coords.longitude.toFixed(4);
            el.textContent = locationStatus;
        },
        function(){
            locationStatus = 'denied';
            el.textContent = t('location_denied');
        },
        { timeout: 8000 }
    );
}

function buildLangSelect(){
    var sel = document.getElementById('langSelect');
    if (!sel) return;
    sel.innerHTML = '';
    LANG_LIST.forEach(function(lang){
        var opt = document.createElement('option');
        opt.value = lang.code;
        opt.textContent = lang.flag + ' ' + lang.name;
        if (lang.code === currentLang) opt.selected = true;
        sel.appendChild(opt);
    });
    sel.onchange = function(){
        currentLang = this.value;
        localStorage.setItem(LANG_KEY, currentLang);
        var ld = LANG_LIST.find(function(l){ return l.code === currentLang; });
        document.documentElement.dir = ld && ld.dir ? ld.dir : 'ltr';
        document.documentElement.lang = currentLang;
        applyTranslations();
        if (finalShown) renderFinalVerdict();
        showToast(t('lang_changed'));
    };
}
