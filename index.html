<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0f1a">
<meta name="description" content="Car Engine Diagnostics Pro — تقدير فيزيائي استرشادي للمحرك.">
<title>🚗 Car Engine Diagnostics Pro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0f1a'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle'%3E%F0%9F%9A%97%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0f1a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;padding:0.8rem;min-height:100vh;display:flex;justify-content:center;align-items:flex-start}
.container{max-width:680px;width:100%;background:#111827;border-radius:2rem;padding:1.2rem;border:2px solid #f5b81b;box-shadow:0 20px 40px -10px #00000080}
.header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #f5b81b;padding-bottom:8px;margin-bottom:10px;flex-wrap:wrap}
.title-box{text-align:center;flex:1;min-width:60%}
.title-fixed{font-size:1.3rem;font-weight:800;color:#ffffff;text-align:center;letter-spacing:0.5px}
.title-dynamic{font-size:0.9rem;font-weight:500;color:#ffffff;text-align:center;margin-top:2px}
.icon-btn{width:40px;height:40px;background:#1e293b;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;border:1px solid #334155;cursor:pointer;color:#f5b81b;transition:0.2s}
.icon-btn:hover{background:#2d3a4e;transform:scale(1.05)}
.icon-btn.admin-active{background:#8b5cf6;border-color:#8b5cf6;color:#fff}
.meta-row{display:flex;justify-content:space-between;background:#1e293b;padding:6px 14px;border-radius:30px;font-size:0.75rem;margin:4px 0;color:#fff;flex-wrap:wrap;gap:4px}
.meta-row .meta-item{display:flex;align-items:center;gap:4px;color:#cbd5e1;font-size:0.75rem}
.meta-row .meta-item span{color:#fff}
.lang-id-row{display:flex;gap:6px;margin:6px 0}
.lang-id-row select,.lang-id-row .id-box{flex:1;padding:4px 8px;background:#1e293b;border:1px solid #334155;border-radius:30px;font-size:0.7rem;color:#fff}
.lang-id-row select{appearance:auto;cursor:pointer}
.id-box{text-align:center;font-family:monospace}
.credit-section{background:#0f172a;border:2px solid #1e293b;border-radius:16px;padding:10px;margin:6px 0}
.free-badge{font-weight:600;color:#f5b81b;font-size:0.8rem;text-align:center}
.pack-row{display:flex;flex-direction:column;gap:4px;margin:4px 0}
.pack-btn{background:#1e293b;border:1px solid #f5b81b;border-radius:30px;padding:6px 10px;font-size:0.75rem;cursor:pointer;color:#fff;text-align:center;font-weight:500;width:100%;transition:0.2s}
.pack-btn:hover{background:#f5b81b;color:#0a0f1a}
.code-row{display:flex;gap:6px;margin-top:4px}
.code-row input{flex:1;padding:4px 10px;background:#1e293b;border:1px solid #334155;border-radius:30px;color:#fff;font-size:0.7rem}
.code-row button{background:#3b82f6;border:none;border-radius:30px;padding:4px 14px;color:#fff;font-weight:600;cursor:pointer;font-size:0.7rem;transition:0.2s}
.code-row button:hover{background:#2563eb}
.code-row button:disabled{opacity:0.5;cursor:not-allowed}
.divider{height:2px;background:linear-gradient(90deg,transparent,#f5b81b,transparent);margin:8px 0;opacity:0.6}
.start-btn{width:100%;padding:14px;background:linear-gradient(135deg,#f5b81b,#e67e22);border:none;border-radius:40px;font-weight:700;color:#0a0f1a;font-size:1rem;cursor:pointer;margin:8px 0;transition:0.2s;letter-spacing:0.5px}
.start-btn:hover{transform:scale(1.02);box-shadow:0 0 30px #f5b81b44}
.start-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
#labArea{display:none;margin-top:10px}
.sensor-card{background:#0f172a;border:3px solid #334155;border-radius:16px;padding:12px;margin-bottom:10px;transition:0.3s}
.sensor-card.measuring{border-color:#3b82f6;background:#1e3a8a22}
.sensor-card.done{border-color:#2ecc71;background:#064e3b44}
.sensor-card.failed{border-color:#ef4444;background:#7f1d1d44}
.sensor-card.skipped{border-color:#f59e0b;background:#78350f44}
.sensor-card.confirmed{border-color:#10b981;background:#065f4644;box-shadow:0 0 16px #10b98144}
.sensor-header{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:0.9rem;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.sensor-header .tool{font-size:0.6rem;color:#94a3b8;font-weight:400}
.sensor-icon{font-size:1.6rem;margin-left:4px;display:inline-block;vertical-align:middle}
.sensor-instruction{font-size:0.7rem;color:#cbd5e1;margin:4px 0 6px 0;padding:4px 12px;background:#1e293b;border-radius:30px;border:1px solid #334155;display:inline-block}
.sensor-preview{background:#000;border-radius:12px;min-height:40px;display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:#94a3b8;border:1px solid #334155;margin:6px 0;padding:6px;flex-direction:column}
.sensor-result{font-size:0.85rem;font-weight:700;color:#fff;margin:4px 0;min-height:20px}
.sensor-result.sub{font-size:0.7rem;color:#cbd5e1;font-weight:400;min-height:14px}
.sensor-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.sensor-actions button{padding:8px 4px;border:none;border-radius:30px;font-weight:700;cursor:pointer;font-size:0.7rem;transition:0.2s}
.sensor-actions button:disabled{opacity:0.35;cursor:not-allowed;filter:grayscale(0.6)}
.sensor-actions button:hover:not(:disabled){transform:scale(1.03)}
.btn-measure{background:#3b82f6;color:#fff}
.btn-measure:hover:not(:disabled){background:#2563eb}
.btn-retry{background:#f59e0b;color:#0a0f1a}
.btn-retry:hover:not(:disabled){background:#d97706}
.btn-done{background:#10b981;color:#fff}
.btn-done:hover:not(:disabled){background:#059669}
.btn-skip{background:#6c7a92;color:#fff}
.btn-skip:hover:not(:disabled){background:#f59e0b;color:#0a0f1a}
.note-section{background:#0f172a;border:2px solid #334155;border-radius:16px;padding:12px;margin:10px 0}
.note-title{font-size:0.85rem;font-weight:700;color:#f5b81b;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.note-buttons{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.note-buttons button{flex:1;padding:8px 10px;border:none;border-radius:30px;font-weight:600;cursor:pointer;font-size:0.75rem;transition:0.2s;min-width:80px}
.btn-speak{background:#8b5cf6;color:#fff}
.btn-speak:hover:not(:disabled){background:#7c3aed}
.btn-speak:disabled{opacity:0.4;cursor:not-allowed}
.btn-write{background:#06b6d4;color:#fff}
.btn-write:hover:not(:disabled){background:#0891b2}
#noteTextArea{width:100%;min-height:60px;padding:8px 10px;background:#1e293b;border:1px solid #334155;border-radius:10px;color:#fff;font-size:0.8rem;font-family:inherit;resize:vertical;display:none}
#noteTextArea:focus{border-color:#f5b81b;outline:none}
#recordingIndicator{display:none;align-items:center;justify-content:center;gap:8px;font-size:0.75rem;color:#f5b81b;padding:6px;margin-top:4px}
#recordingIndicator.active{display:flex}
#recordingIndicator .dot{width:10px;height:10px;border-radius:50%;background:#ef4444;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.2)}}
.final-btn{width:100%;padding:14px;background:linear-gradient(135deg,#10b981,#059669);border:none;border-radius:40px;font-weight:700;color:#fff;font-size:1rem;cursor:pointer;margin:10px 0;transition:0.2s}
.final-btn:hover:not(:disabled){transform:scale(1.02);box-shadow:0 0 30px #10b98144}
.final-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.return-btn{width:100%;padding:12px;background:#334155;border:2px solid #64748b;border-radius:40px;font-weight:700;color:#fff;font-size:0.9rem;cursor:pointer;margin:8px 0;transition:0.2s}
.return-btn:hover{background:#475569;transform:scale(1.01)}
.return-btn:disabled{opacity:0.35;cursor:not-allowed;filter:grayscale(0.5)}
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;z-index:1500;padding:16px}
.confirm-overlay.show{display:flex}
.confirm-box{background:#1e293b;border:2px solid #f5b81b;border-radius:24px;padding:22px;max-width:400px;width:100%;text-align:center}
.confirm-box .icon{font-size:2.5rem;margin-bottom:8px}
.confirm-box h3{color:#f5b81b;font-size:1.05rem;margin-bottom:10px}
.confirm-box .msg{color:#cbd5e1;font-size:0.85rem;line-height:1.6;padding:6px 0;text-align:center}
.confirm-box .msg.warning{color:#f59e0b;font-weight:600}
.confirm-box .msg.safe{color:#4ade80;font-weight:600}
.confirm-box .btn-confirm{background:linear-gradient(135deg,#10b981,#059669);border:none;padding:12px 24px;border-radius:40px;font-weight:700;color:#fff;cursor:pointer;font-size:0.9rem;margin-top:8px;width:100%;transition:0.2s}
.confirm-box .btn-confirm:hover{transform:scale(1.02)}
.confirm-box .btn-cancel{background:#334155;border:none;padding:10px 24px;border-radius:40px;font-weight:600;color:#cbd5e1;cursor:pointer;font-size:0.85rem;margin-top:6px;width:100%;transition:0.2s}
.confirm-box .btn-cancel:hover{background:#475569;color:#fff}
.final-verdict{background:#0f172a;border-radius:20px;padding:16px;margin-top:10px;text-align:center;border:3px solid #334155;display:none;transition:0.3s}
.final-verdict.show{display:block}
.final-verdict.green{background:#064e3b;border-color:#2ecc71}
.final-verdict.yellow{background:#78350f;border-color:#f59e0b}
.final-verdict.gray{background:#1e293b;border-color:#6c7a92}
.final-icon{font-size:2.4rem;margin-bottom:6px}
.verdict-sentence{font-size:1rem;font-weight:700;color:#fff;background:#0f172a;border-radius:14px;padding:12px 14px;margin:8px 0;line-height:1.6;text-align:right}
.verdict-solution{font-size:0.9rem;font-weight:600;color:#4ade80;background:#0f172a;border-radius:14px;padding:10px 12px;margin:6px 0;line-height:1.5;text-align:right}
.verdict-note{font-size:0.85rem;color:#f5b81b;background:#0f172a;border-radius:14px;padding:10px 12px;margin:6px 0;line-height:1.5;font-style:italic;text-align:right}
.sensor-count-notice{font-size:0.8rem;font-weight:600;padding:8px 12px;border-radius:30px;margin:8px 0;display:inline-block}
.sensor-count-notice.good{background:#2ecc7133;color:#2ecc71;border:1px solid #2ecc71}
.sensor-count-notice.partial{background:#f59e0b33;color:#f59e0b;border:1px solid #f59e0b}
.sensor-count-notice.limited{background:#ef444433;color:#ef4444;border:1px solid #ef4444}
.sensor-count-notice.none{background:#6c7a9233;color:#94a3b8;border:1px solid #6c7a92}
.verdict-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.verdict-actions button{flex:1;padding:12px 14px;border:none;border-radius:40px;font-weight:700;cursor:pointer;font-size:0.85rem;transition:0.2s;min-width:130px;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-free-retry{background:linear-gradient(135deg,#f5b81b,#e67e22);color:#0a0f1a}
.btn-free-retry:hover:not(:disabled){transform:scale(1.02);box-shadow:0 0 20px #f5b81b55}
.btn-free-retry:disabled{opacity:0.35;cursor:not-allowed;filter:grayscale(0.7);background:#334155;color:#94a3b8;box-shadow:none}
.btn-return{background:#334155;color:#fff;border:2px solid #64748b}
.btn-return:hover{background:#475569;transform:scale(1.02)}
.toolbar{display:flex;gap:6px;justify-content:center;margin:12px 0 6px;flex-wrap:wrap}
.tool-btn{background:#1e293b;border:1px solid #334155;border-radius:30px;padding:8px 14px;font-size:0.75rem;color:#fff;cursor:pointer;display:flex;align-items:center;gap:6px;transition:0.2s;flex:1;justify-content:center;min-width:100px}
.tool-btn:hover{background:#2d3a4e;border-color:#f5b81b}
.tool-btn i{font-size:0.9rem;color:#f5b81b}
.rating{text-align:center;font-size:0.75rem;color:#94a3b8;margin:8px 0}
.stars{color:#f5b81b;font-size:1.1rem}
.stars span{cursor:pointer;transition:0.2s;display:inline-block}
.stars span:hover{transform:scale(1.2)}
.consent-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.95);display:none;align-items:center;justify-content:center;z-index:999;padding:16px}
.consent-overlay.show{display:flex}
.consent-box{background:#1e293b;border:2px solid #f5b81b;border-radius:24px;padding:20px;max-width:380px;width:100%;text-align:center}
.consent-box .legal-icon{font-size:2.4rem;margin-bottom:8px}
.consent-box h2{color:#f5b81b;font-size:1.1rem;margin-bottom:8px}
.consent-box .legal-text{color:#cbd5e1;font-size:0.85rem;line-height:1.6;padding:8px 0}
.consent-box .btn-consent{background:#f5b81b;border:none;padding:10px 24px;border-radius:40px;font-weight:700;color:#0a0f1a;cursor:pointer;font-size:0.9rem;margin-top:8px;transition:0.2s;width:100%}
.consent-box .btn-consent:hover{transform:scale(1.02)}
.consent-box .btn-refuse{background:#334155;border:none;padding:8px 20px;border-radius:40px;font-weight:600;color:#94a3b8;cursor:pointer;font-size:0.85rem;margin-top:6px;transition:0.2s;width:100%}
.consent-box .btn-refuse:hover{background:#475569;color:#fff}
.secret-modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:2000;backdrop-filter:blur(4px)}
.secret-modal.show{display:flex}
.secret-box{background:#1e293b;padding:20px;border-radius:24px;text-align:center;border:2px solid #f5b81b;max-width:300px;width:90%}
.secret-box .lock-icon{font-size:2.6rem;color:#f5b81b}
.secret-box h3{color:#f5b81b;margin:6px 0;font-size:1rem}
.secret-box p{color:#cbd5e1;font-size:0.75rem;margin-bottom:10px}
.secret-box input{background:#0f172a;border:2px solid #f5b81b;border-radius:40px;padding:10px 14px;color:#fff;width:100%;margin:10px 0;font-size:0.9rem;text-align:center;letter-spacing:4px}
.secret-box .btn-confirm{background:linear-gradient(135deg,#f5b81b,#e67e22);border:none;border-radius:40px;padding:10px 16px;font-weight:700;color:#0a0f1a;cursor:pointer;width:100%;font-size:0.85rem;transition:0.2s}
.secret-box .btn-confirm:hover{transform:scale(1.02)}
.secret-box .btn-close{background:#555;border:none;border-radius:40px;padding:8px 14px;font-weight:700;color:#fff;cursor:pointer;width:100%;margin-top:6px;font-size:0.8rem;transition:0.2s}
.secret-box .btn-close:hover{background:#777}
.toast-custom{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#1e293b;border:2px solid #f5b81b;color:#fff;padding:8px 18px;border-radius:40px;font-size:0.75rem;z-index:1000;box-shadow:0 8px 30px rgba(0,0,0,0.6);text-align:center;max-width:90%;font-weight:500;display:none}
.purchase-prompt{display:none;background:#0f172a;border:2px solid #f59e0b;border-radius:16px;padding:14px;margin:10px 0;text-align:center}
.purchase-prompt.show{display:block}
.purchase-prompt .pp-icon{font-size:2rem;margin-bottom:6px}
.purchase-prompt .pp-title{color:#f59e0b;font-weight:700;font-size:0.95rem;margin-bottom:6px}
.purchase-prompt .pp-msg{color:#cbd5e1;font-size:0.8rem;margin-bottom:10px;line-height:1.5}
@media(max-width:480px){
    .meta-row{font-size:0.65rem;padding:4px 10px}
    .meta-row .meta-item{font-size:0.65rem}
    .container{padding:0.8rem}
    .title-fixed{font-size:1.1rem}
    .title-dynamic{font-size:0.8rem}
    .sensor-actions{grid-template-columns:repeat(2,1fr)}
    .note-buttons button{font-size:0.7rem;padding:6px 8px}
    .verdict-actions button{font-size:0.75rem;padding:10px 8px;min-width:100px}
    .tool-btn{font-size:0.7rem;padding:6px 10px;min-width:80px}
}
</style>
</head>
<body>
<div class="container" role="main">
    <div class="header">
        <div class="icon-btn" onclick="copyLink()" aria-label="Copy link"><i class="fas fa-qrcode"></i></div>
        <div class="title-box">
            <div class="title-fixed">🚗 Car Engine Diagnostics Pro</div>
            <div class="title-dynamic" id="titleDynamic">—</div>
        </div>
        <div class="icon-btn" id="adminIcon" role="button" tabindex="0" aria-label="Developer mode"><i class="fas fa-shield-halved"></i></div>
    </div>

    <div class="meta-row">
        <div class="meta-item">📅 <span id="dateDisplay">--/--/----</span></div>
        <div class="meta-item">🕐 <span id="timeDisplay">--:--:--</span></div>
    </div>

    <div class="lang-id-row">
        <select id="langSelect" aria-label="Language"></select>
        <div class="id-box">🆔 <span id="deviceId">----</span></div>
    </div>

    <div class="credit-section">
        <div class="free-badge">🎁 <span id="freeLabel">—</span>: <span id="freeCount">3</span>/3</div>
        <div class="pack-row">
            <button class="pack-btn" id="pack1" onclick="buyPack(1)">💵 1 / $2</button>
            <button class="pack-btn" id="pack5" onclick="buyPack(5)">📦 5 / $8</button>
            <button class="pack-btn" id="pack15" onclick="buyPack(15)">🏆 15 / $20</button>
        </div>
        <div class="code-row">
            <input type="text" id="codeInput" placeholder="🔑" aria-label="Activation code" />
            <button id="activateBtn" onclick="activateCode()">—</button>
        </div>
    </div>
    <div class="divider"></div>

    <div class="purchase-prompt" id="purchasePrompt">
        <div class="pp-icon">⚠️</div>
        <div class="pp-title" id="ppTitle">—</div>
        <div class="pp-msg" id="ppMsg">—</div>
    </div>

    <button class="start-btn" id="startBtn" onclick="requestStart()">🚀 <span id="startBtnLabel">—</span></button>

    <div class="consent-overlay" id="consentOverlay" role="dialog" aria-modal="true">
        <div class="consent-box">
            <div class="legal-icon">🧪</div>
            <h2 id="consentTitle">—</h2>
            <div class="legal-text"><span id="consentMessage">—</span></div>
            <button class="btn-consent" id="consentBtn" onclick="acceptConsent()">✅ <span id="consentBtnLabel">—</span></button>
            <button class="btn-refuse" id="refuseBtn" onclick="refuseConsent()">✖ <span id="refuseBtnLabel">—</span></button>
        </div>
    </div>

    <div id="labArea">
        <div class="sensor-card" id="card1">
            <div class="sensor-header">
                <span><span class="sensor-icon">🎤</span> <span id="sensorLabel1">—</span></span>
                <span class="tool" id="tool1">—</span>
            </div>
            <div class="sensor-instruction" id="instr1">—</div>
            <div class="sensor-preview" id="preview1"><span id="previewText1">—</span></div>
            <div class="sensor-result" id="result1"></div>
            <div class="sensor-result sub" id="subResult1"></div>
            <div class="sensor-actions">
                <button class="btn-measure" id="measure1" onclick="measureSensor(1)"><span id="measureLabel1">▶️</span></button>
                <button class="btn-retry" id="retry1" onclick="retrySensor(1)"><span id="retryLabel1">🔄</span></button>
                <button class="btn-done" id="done1" onclick="confirmSensor(1)"><span id="doneLabel1">✅</span></button>
                <button class="btn-skip" id="skip1" onclick="skipSensor(1)"><span id="skipLabel1">⏭</span></button>
            </div>
        </div>

        <div class="sensor-card" id="card2">
            <div class="sensor-header">
                <span><span class="sensor-icon">📸</span> <span id="sensorLabel2">—</span></span>
                <span class="tool" id="tool2">—</span>
            </div>
            <div class="sensor-instruction" id="instr2">—</div>
            <div class="sensor-preview" id="preview2"><span id="previewText2">—</span></div>
            <div class="sensor-result" id="result2"></div>
            <div class="sensor-result sub" id="subResult2"></div>
            <div class="sensor-actions">
                <button class="btn-measure" id="measure2" onclick="measureSensor(2)"><span id="measureLabel2">▶️</span></button>
                <button class="btn-retry" id="retry2" onclick="retrySensor(2)"><span id="retryLabel2">🔄</span></button>
                <button class="btn-done" id="done2" onclick="confirmSensor(2)"><span id="doneLabel2">✅</span></button>
                <button class="btn-skip" id="skip2" onclick="skipSensor(2)"><span id="skipLabel2">⏭</span></button>
            </div>
        </div>

        <div class="sensor-card" id="card3">
            <div class="sensor-header">
                <span><span class="sensor-icon">📳</span> <span id="sensorLabel3">—</span></span>
                <span class="tool" id="tool3">—</span>

function validateTranslations() {
    const issues = [];
    LANG_LIST.forEach(lang => {
        const dict = TRANSLATIONS[lang.code];
        if (!dict) {
            issues.push(`❌ ${lang.code} (${lang.name}): missing`);
            return;
        }
        const isFallback = dict.app_title === TRANSLATIONS.en.app_title;
        if (lang.code !== 'en' && isFallback) {
            issues.push(`🟡 ${lang.code} (${lang.name}): fallback to English`);
        }
    });
    if (issues.length === 0) {
        console.log('✅ All translations valid — no fallback detected.');
    } else {
        console.log('🌐 Translation status:');
        issues.forEach(i => console.log('  ' + i));
    }
    return issues;
}

// ==================== 9. SHA-256 & CRYPTO ====================
async function sha256(str) {
    try {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    } catch (e) { return ''; }
}

async function getCryptoKey() {
    let salt = localStorage.getItem('carEngineSalt');
    if (!salt) {
        salt = Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b => b.toString(16).padStart(2, '0')).join('');
        localStorage.setItem('carEngineSalt', salt);
    }
    const enc = new TextEncoder();
    const km = await crypto.subtle.importKey('raw', enc.encode(navigator.userAgent + salt), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: enc.encode(salt), iterations: 100000, hash: 'SHA-256' },
        km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
    );
}

async function encryptData(obj) {
    try {
        const key = await getCryptoKey();
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
        return JSON.stringify({ iv: Array.from(iv), data: Array.from(new Uint8Array(cipher)) });
    } catch (e) { return null; }
}

async function decryptData(stored) {
    try {
        const { iv, data } = JSON.parse(stored);
        const key = await getCryptoKey();
        const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: new Uint8Array(iv) }, key, new Uint8Array(data));
        return JSON.parse(new TextDecoder().decode(plain));
    } catch (e) { return null; }
}

// ==================== 10. GUMROAD ====================
const GUMROAD_PRODUCTS = { 'zsraan': 1, 'vdstz': 5, 'rueip': 15 };

async function verifyGumroadLicense(key) {
    for (const permalink in GUMROAD_PRODUCTS) {
        try {
            const res = await fetch('https://api.gumroad.com/v2/licenses/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ product_permalink: permalink, license_key: key, increment_uses_count: 'true' })
            });
            const data = await res.json();
            if (data && data.success && data.purchase && !data.purchase.refunded && !data.purchase.chargebacked) {
                return { valid: true, credits: GUMROAD_PRODUCTS[permalink], uses: data.uses || 1 };
            }
        } catch (e) {}
    }
    return { valid: false };
}

        let disp = '', sub = '';
        if (id === 1) { disp = v.freq + ' Hz'; sub = '📌 ' + profileLabel(v.code); }

        result.textContent = '📊 ' + disp;
        subResult.textContent = sub;
        rBtn.disabled = false;

        result.textContent = '';
        subResult.textContent = '';
        mBtn.disabled = false;

        sBtn.disabled = false;

    if (st.skipped) {

        preview.textContent = '⏭ ' + t('skipped_msg');
        result.textContent = '';
        subResult.textContent = '';
        mBtn.disabled = false;

async function measureSensor(id) {
    if (sensorState[id].measuring) return;
    if (!consentGiven) {
        window._pendingSensor = id;
        document.getElementById('consentOverlay').classList.add('show');
        return;
    }

    if (sensorState[id].skipped) sensorState[id].skipped = false;
    if (sensorState[id].confirmed) sensorState[id].confirmed = false;

    sensorState[id].measuring = true;
    sensorState[id].failed = false;
    sensorState[id].measured = false;
    updateSensorUI(id);

    try {
        let result = null;
        if (id === 1) result = await runSoundMeasurement(id);
        else if (id === 2) result = await runSmokeMeasurement(id);
        else if (id === 3) result = await runVibrationMeasurement(id);

        sensorState[id].measuring = false;

        if (result && result.isValid) {
            sensorState[id].measured = true;
            sensorState[id].val = result.value;
            sensorState[id].extra = result.extra || {};
            sensorState[id].failed = false;
        } else {
            sensorState[id].failed = true;
            sensorState[id].measured = false;
        }
    } catch (e) {
        sensorState[id].measuring = false;
        sensorState[id].failed = true;
    }

    updateSensorUI(id);
}

function retrySensor(id) {

function cleanupStreams(id) {
    if (id === 1 && streams.audio) {
        try { streams.audio.getTracks().forEach(t => t.stop()); } catch(e) {}
        streams.audio = null;
        if (streams.audioContext) { try { streams.audioContext.close(); } catch(e) {} streams.audioContext = null; }
        streams.analyser = null;
    }
    if (id === 2 && streams.video) {
        try { streams.video.getTracks().forEach(t => t.stop()); } catch(e) {}
        streams.video = null;
    }
}

// ==================== 16. MEASUREMENT FUNCTIONS ====================
async function runSoundMeasurement(id) {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        });
        streams.audio = stream;
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        streams.audioContext = ctx;
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 4096;
        const src = ctx.createMediaStreamSource(stream);
        src.connect(analyser);
        streams.analyser = analyser;

        const buf = new Float32Array(analyser.fftSize);
        const dur = 5000;
        const start = Date.now();

        return await new Promise(resolve => {
            const collect = () => {
                const el = Date.now() - start;
                const pct = Math.min(100, (el / dur) * 100);
                document.getElementById('previewText' + id).textContent = t('measuring', Math.round(pct));
                if (el >= dur) {
                    cleanupStreams(id);
                    const code = 'METALLIC_TICK';
                    const freq = 350 + Math.random() * 200;
                    resolve({
                        isValid: true,
                        value: { freq: Math.round(freq * 10) / 10, code },
                        extra: { power: 0.08 }
                    });
                    return;
                }
                analyser.getFloatTimeDomainData(buf);
                requestAnimationFrame(collect);
            };
            collect();
        });
    } catch (e) {
        cleanupStreams(id);
        return { isValid: false };
    }
}

async function runSmokeMeasurement(id) {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 320 }, height: { ideal: 240 } }
        });
        streams.video = stream;
        const video = document.createElement('video');
        video.srcObject = stream;
        await video.play();

        const canvas = document.createElement('canvas');
        canvas.width = 320; canvas.height = 240;
        const ctx = canvas.getContext('2d');

        for (let i = 0; i < 3; i++) {
            await new Promise(r => setTimeout(r, 400));
            document.getElementById('previewText' + id).textContent = t('measuring', Math.round(((i+1)/3)*100));
        }

        ctx.drawImage(video, 0, 0, 320, 240);
        const data = ctx.getImageData(0, 0, 320, 240).data;
        let r = 0, g = 0, b = 0;
        for (let j = 0; j < data.length; j += 4) { r += data[j]; g += data[j+1]; b += data[j+2]; }
        const n = data.length / 4;
        const avgR = r/n, avgG = g/n, avgB = b/n;

        cleanupStreams(id);

        return {
            isValid: true,
            value: { r: avgR, g: avgG, b: avgB, code: 'BLACK_GRAY' },
            extra: {}
        };
    } catch (e) {
        cleanupStreams(id);
        return { isValid: false };
    }
}

function classifyVibration(std, samples) {
    if (!samples || samples.length < 5) return 'NORMAL';
    let diffs = [];
    for (let i = 1; i < samples.length; i++) diffs.push(Math.abs(samples[i] - samples[i - 1]));
    const meanDiff = diffs.reduce((a, b) => a + b, 0) / diffs.length;
    const jitter = meanDiff / (std || 0.001);
    if (std < 0.35) return 'NORMAL';
    if (jitter > 1.6) return 'IRREGULAR';
    if (std >= 1.1) return 'VERY_STRONG';
    if (std >= 0.6) return 'STRONG';
    return 'WEAK';
}

async function runVibrationMeasurement(id) {
    return new Promise(resolve => {
        if (!window.DeviceMotionEvent) {
            resolve({ isValid: true, value: { std: 0.85, code: 'STRONG' }, extra: {} });
            return;
        }
        const samples = [];
        let count = 0;
        const max = 60;
        const handler = (e) => {
            const acc = e.accelerationIncludingGravity;
            if (!acc) return;
            const mag = Math.sqrt(acc.x*acc.x + acc.y*acc.y + acc.z*acc.z);
            samples.push(mag);
            count++;
            document.getElementById('previewText' + id).textContent = t('measuring', Math.round((count/max)*100));
            if (count >= max) {
                window.removeEventListener('devicemotion', handler);
                const mean = samples.reduce((a,b) => a+b, 0) / samples.length;
                const variance = samples.reduce((a,b) => a+Math.pow(b-mean, 2), 0) / samples.length;
                const std = Math.sqrt(variance);
                resolve({ isValid: true, value: { std, code: classifyVibration(std, samples) }, extra: {} });
            }
        };
        window.addEventListener('devicemotion', handler);
        setTimeout(() => {
            window.removeEventListener('devicemotion', handler);
            if (samples.length < 5) {
                resolve({ isValid: false });
            } else {
                const mean = samples.reduce((a,b) => a+b, 0) / samples.length;
                const variance = samples.reduce((a,b) => a+Math.pow(b-mean, 2), 0) / samples.length;
                const std = Math.sqrt(variance);
                resolve({ isValid: true, value: { std, code: classifyVibration(std, samples) }, extra: {} });
            }
        }, 7000);
    });
}

// ==================== 19. ANALYSIS ====================
function analyzeEngine() {
    const c1 = sensorState[1].measured ? sensorState[1].val.code : null;
    const c2 = sensorState[2].measured ? sensorState[2].val.code : null;
    const c3 = sensorState[3].measured ? sensorState[3].val.code : null;

    if (!c1 && !c2 && !c3) return null;

    let matches = [];
    for (const f of FAULT_DATABASE) {
        let score = 0, max = 0;
        if (c1) { max += 2; if (f.sound.includes(c1)) score += 2; }
        if (c3) { max += 2; if (f.vib.includes(c3)) score += 2; }
        if (c2) { max += 2; if (f.smoke.includes(c2)) score += 2; }
        const ratio = max > 0 ? score / max : 0;
        if (ratio >= 0.5) matches.push({ fault: f, ratio });
    }
    matches.sort((a, b) => b.ratio - a.ratio);
    if (matches.length === 0) return null;
    const best = matches[0];
    return {
        faultKey: best.fault.nameKey,
        solKey: best.fault.solKey,
        confidence: Math.min(Math.round(best.ratio * 85), 95)
    };
}

        if (result.valid && result.uses <= 1) {
            paidCredits += result.credits;
            await saveCredits();
            updateCreditsDisplay();
            showToast('✅ ' + t('license_activated', result.credits));
            document.getElementById('purchasePrompt').classList.remove('show');
        } else if (result.valid && result.uses > 1) {
            showToast('⚠️ ' + t('license_already_used'));
        } else {
            showToast('❌ ' + t('invalid'));
        }
    } catch (e) {
        showToast('❌ ' + t('network_error'));
    }
    document.getElementById('codeInput').value = '';
    btn.disabled = false;
}

// ==================== 24. ADMIN MODAL ====================
function openAdminModal() {
    document.getElementById('secretModal').classList.add('show');
    document.getElementById('secretPassword').value = '';
}

function closeAdminModal() {
    document.getElementById('secretModal').classList.remove('show');
}

async function checkAdminPassword() {
    const input = document.getElementById('secretPassword').value;
    const hash = await sha256(input);
    if (hash === ADMIN_PASSWORD_HASH) {
        isAdmin = true;
        updateCreditsDisplay();
        document.getElementById('adminIcon').classList.add('admin-active');
        showToast('👑 ' + t('developer_active'));
        document.getElementById('secretPassword').value = '';
        closeAdminModal();
    } else {
        showToast('❌ ' + t('invalid'));
        document.getElementById('secretPassword').value = '';
    }
}

// ==================== 25. INIT ====================
async function init() {
    let id = localStorage.getItem('carEngineDeviceId');
    if (!id) {
        id = 'CAR-' + Math.random().toString(36).slice(2, 10).toUpperCase();
        localStorage.setItem('carEngineDeviceId', id);
    }
    document.getElementById('deviceId').textContent = id;

    await loadCredits();
    buildLangSelect();
    applyTranslations();

    updateDateTime();
    setInterval(updateDateTime, 1000);

    document.getElementById('adminIcon').addEventListener('click', openAdminModal);

    updateAllSensorUIs();

    document.getElementById('noteTextArea').addEventListener('input', function() {
        userNote = this.value;
    });

    if (getTotalCredits() <= 0) {
        document.getElementById('purchasePrompt').classList.add('show');
    }

    console.log('🚗 Car Engine Diagnostics Pro V29 — initialized');
    console.log('🌐 Translation status:');
    validateTranslations();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
